# Demonstrates progressive delivery after Argo Rollouts is installed.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nukesandbox-api-canary
  namespace: nukesandbox
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nukesandbox-canary
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 5m }
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nukesandbox-canary
    spec:
      serviceAccountName: nukesandbox-api
      containers:
        - name: api
          image: ghcr.io/sakthis-oss/nukesandbox@sha256:REPLACE_WITH_SIGNED_DIGEST
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
