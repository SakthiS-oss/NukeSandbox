# Requires External Secrets Operator and a preconfigured ClusterSecretStore named "vault-backend".
# The secret value is never committed; ESO writes it to nukesandbox-runtime at runtime.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nukesandbox-runtime
  namespace: nukesandbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: nukesandbox-runtime
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_API_KEY
      remoteRef:
        key: nukesandbox/google-api-key
    - secretKey: NUKESANDBOX_MODEL
      remoteRef:
        key: nukesandbox/model
