apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nukesandbox
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: nukesandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nukesandbox
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
---
# Sandbox Pods may reach only DNS and the in-namespace egress proxy. The proxy
# evaluates the final destination for every connection, including redirects.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-sandbox-egress-to-proxy
  namespace: nukesandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nukesandbox-sandbox
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nukesandbox-egress-proxy
      ports:
        - protocol: TCP
          port: 3128
