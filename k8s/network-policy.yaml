apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nukesandbox
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: nukesandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nukesandbox
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
