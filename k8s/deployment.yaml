apiVersion: apps/v1
kind: Deployment
metadata:
  name: nukesandbox-api
  namespace: nukesandbox
  labels:
    app.kubernetes.io/name: nukesandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nukesandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nukesandbox
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: nukesandbox-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # CI verifies Cosign and replaces this tag with a signed digest before rollout.
          # Never ship :latest; Kyverno rejects mutable tags.
          image: ghcr.io/sakthis-oss/nukesandbox:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SANDBOX_EXECUTION_MODE
              value: kubernetes
            - name: SANDBOX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_EGRESS_PROXY
              value: http://nukesandbox-egress-proxy:3128
            - name: REQUIRE_EGRESS_PROXY
              value: "true"
            - name: API_AUTH_REQUIRED
              value: "true"
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: CONCURRENCY_LIMIT_ENABLED
              value: "true"
          envFrom:
            - secretRef:
                name: nukesandbox-runtime
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nukesandbox-api
  namespace: nukesandbox
spec:
  selector:
    app.kubernetes.io/name: nukesandbox
  ports:
    - name: http
      port: 80
      targetPort: http
