pekko {
  loglevel = INFO
  kafka.consumer {
    stop-timeout = 5s
  }
}

nukesandbox {
  kafka-bootstrap = "localhost:9094"
  kafka-bootstrap = ${?KAFKA_BOOTSTRAP_SERVERS}
  command-topic = "nukesandbox.analyze.commands"
  consumer-group = "nukesandbox-pekko-workers"
  api-base-url = "http://127.0.0.1:8000"
  api-base-url = ${?NUKESANDBOX_API_BASE_URL}
  internal-token = ""
  internal-token = ${?INTERNAL_API_TOKEN}
  max-in-flight = 2
}
